<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. -->
<html lang="en" data-theme="githubDark">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `maximum-scale=1, user-scalable=no` disables pinch-zoom and iOS's
         focus auto-zoom; `viewport-fit=cover` lets the app paint under the
         notch / home indicator (it pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12101a"
      media="(prefers-color-scheme: dark)"
    />
    <title>Time — time report</title>
    <meta
      name="description"
      content="Time is a local-first time report PWA. Start working with one tap and stop with the same one, log breaks and what kind of work you are doing, and read your hours back per project as a clock, a log and charts. Your hours stay on your device, and sync to Dropbox only if you connect one."
    />
    <link rel="canonical" href="https://time.niclaslindstedt.se/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Time" />
    <meta
      property="og:description"
      content="A privacy-first time report: start and stop working, log breaks and kinds of work, and read your hours back per project as charts. No account, no server."
    />
    <meta property="og:url" content="https://time.niclaslindstedt.se/" />
    <meta
      property="og:image"
      content="https://time.niclaslindstedt.se/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Time" />
    <meta
      name="twitter:description"
      content="A privacy-first time report: start and stop working, log breaks and kinds of work, and read your hours back per project as charts. No account, no server."
    />
    <meta
      name="twitter:image"
      content="https://time.niclaslindstedt.se/og.png"
    />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Time",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "description": "A local-first time report PWA: start and stop working, log breaks and kinds of work as they happen or afterwards, and read your hours back per project as a clock, a log and charts. Optional Dropbox sync.",
        "url": "https://time.niclaslindstedt.se/",
        "image": "https://time.niclaslindstedt.se/og.png",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
