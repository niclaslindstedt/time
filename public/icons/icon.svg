<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app mark: a thick ring with its middle cut out, like a record
       button. Flat green on the dark install surface — the same treatment as
       the sibling apps, so they read as one family on a home screen. Flat
       means flat: one stroke, no gradient, no bevel.

       Geometry, in the 100 viewBox: a circle of radius 29 stroked at 22, so
       the ring runs from radius 18 out to 40. The same numbers are
       rasterised into the PNG install icons, the favicon and the social card
       by scripts/generate-icons.mjs (`npm run icons`) and mirrored in
       src/app/icons.tsx and the dial's printing in src/app/Dial.tsx — they
       are kept in step by hand. -->
  <rect width="100" height="100" rx="20" fill="#12101a" />
  <circle cx="50" cy="50" r="29" fill="none" stroke="#3ef07f" stroke-width="22" />
</svg>
