<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app mark: a clock face — a ring and two hands, ten past twelve, the
       first minutes of a working day. Flat green on the dark install surface,
       thick stroke, round caps — the same treatment as the sibling apps, so
       they read as one family on a home screen. Flat means flat: one fill,
       no gradient, no bevel.

       Geometry, in the 100 viewBox: a circle of radius 34 stroked at 12, the
       hour hand from the centre straight up to y=28, the minute hand from the
       centre to (66, 60). The same numbers are rasterised into the PNG
       install icons, the favicon and the social card by
       scripts/generate-icons.mjs (`npm run icons`) and mirrored in
       src/app/icons.tsx — the three are kept in step by hand. -->
  <rect width="100" height="100" rx="20" fill="#12101a" />
  <circle cx="50" cy="50" r="34" fill="none" stroke="#3ef07f" stroke-width="12" />
  <path
    d="M50 50 V28 M50 50 L66 60"
    fill="none"
    stroke="#3ef07f"
    stroke-width="12"
    stroke-linecap="round"
  />
</svg>
